<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Livraria - Gerenciamento de Livros</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header>
    <h1>📚 Livraria - Gerenciamento de Livros</h1>
  </header>

  <main>
    <section class="form-section">
      <h2>Cadastrar / Editar Livro</h2>
      <form id="form-livro">
        <input type="hidden" id="livro-id">

        <label for="titulo">Título</label>
        <input type="text" id="titulo" required>

        <label for="autor">Autor</label>
        <input type="text" id="autor" required>

        <label for="editora">Editora</label>
        <input type="text" id="editora">

        <label for="ano">Ano de Publicação</label>
        <input type="number" id="ano">

        <label for="preco">Preço (R$)</label>
        <input type="number" step="0.01" id="preco" required>

        <label for="quantidade">Quantidade em Estoque</label>
        <input type="number" id="quantidade" required>

        <button type="submit">Salvar Livro</button>
      </form>
    </section>

    <section class="lista-section">
      <h2>Livros Cadastrados</h2>
      <table id="tabela-livros">
        <thead>
          <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>Editora</th>
            <th>Ano</th>
            <th>Preço</th>
            <th>Qtd</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
          <!-- Livros carregados via JavaScript -->
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>Projeto Livraria - Atividade de Versionamento com Git</p>
  </footer>

<script>
// URL do backend PHP
const API_URL = "backend.php";

const form = document.getElementById("form-livro");
const corpoTabela = document.getElementById("corpo-tabela");

// Carregar lista de livros
async function carregarLivros() {
  const resposta = await fetch(API_URL);
  const livros = await resposta.json();
  corpoTabela.innerHTML = "";
  livros.forEach(livro => {
    corpoTabela.innerHTML += `
      <tr>
        <td>${livro.titulo}</td>
        <td>${livro.autor}</td>
        <td>${livro.editora ?? ""}</td>
        <td>${livro.ano_publicacao ?? ""}</td>
        <td>R$ ${parseFloat(livro.preco).toFixed(2)}</td>
        <td>${livro.quantidade}</td>
        <td>
          <button onclick="editarLivro(${livro.id}, '${livro.titulo}', '${livro.autor}', '${livro.editora}', ${livro.ano_publicacao}, ${livro.preco}, ${livro.quantidade})">Editar</button>
          <button onclick="excluirLivro(${livro.id})">Excluir</button>
        </td>
      </tr>
    `;
  });
}

// Salvar (cadastrar ou atualizar) livro
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const id = document.getElementById("livro-id").value;
  const livro = {
    titulo: document.getElementById("titulo").value,
    autor: document.getElementById("autor").value,
    editora: document.getElementById("editora").value,
    ano_publicacao: document.getElementById("ano").value,
    preco: document.getElementById("preco").value,
    quantidade: document.getElementById("quantidade").value
  };

  if (id) {
    livro.id = id;
    await fetch(API_URL, { method: "PUT", body: JSON.stringify(livro) });
  } else {
    await fetch(API_URL, { method: "POST", body: JSON.stringify(livro) });
  }

  form.reset();
  document.getElementById("livro-id").value = "";
  carregarLivros();
});

// Preencher formulário para edição
function editarLivro(id, titulo, autor, editora, ano, preco, quantidade) {
  document.getElementById("livro-id").value = id;
  document.getElementById("titulo").value = titulo;
  document.getElementById("autor").value = autor;
  document.getElementById("editora").value = editora;
  document.getElementById("ano").value = ano;
  document.getElementById("preco").value = preco;
  document.getElementById("quantidade").value = quantidade;
}

// Excluir livro
async function excluirLivro(id) {
  if (confirm("Deseja realmente excluir este livro?")) {
    await fetch(API_URL, { method: "DELETE", body: JSON.stringify({ id }) });
    carregarLivros();
  }
}

carregarLivros();
</script>

</body>
</html>
